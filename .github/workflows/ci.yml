name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run verify

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Build the plugin
      - run: npm ci
      - run: npm run build

      # Install E2E test app dependencies
      - name: Install E2E app dependencies
        working-directory: __tests__/e2e/strapi-app
        run: npm ci

      # Build Strapi app (compiles TS, builds admin)
      - name: Build Strapi app
        working-directory: __tests__/e2e/strapi-app
        run: npx strapi build
        env:
          BROWSER: none
          NODE_OPTIONS: --max-old-space-size=4096

      # Ensure required directories exist
      - name: Create required directories
        working-directory: __tests__/e2e/strapi-app
        run: mkdir -p public/uploads .tmp

      # Start Strapi in background
      - name: Start Strapi
        working-directory: __tests__/e2e/strapi-app
        run: npx strapi start &
        env:
          NODE_ENV: production

      # Wait for Strapi to be ready
      - name: Wait for Strapi
        run: |
          echo "Waiting for Strapi to start..."
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:1337/_health | grep -q ''; then
              echo "Strapi is ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Strapi failed to start"
              exit 1
            fi
            sleep 1
          done

      # Run E2E tests
      - name: Run E2E tests
        run: npm run test:e2e
